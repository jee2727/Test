name: Update LHEQ Hockey Statistics (Manual Only)

on:
  workflow_dispatch:

jobs:
  update-statistics:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      
      - name: Run LHEQ Scraper
        run: python lheq_scraper.py
        continue-on-error: true
      
      - name: Run Statistics Compiler
        run: python lheq_stats.py --skip-goalies
        continue-on-error: true
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "Manual update: LHEQ stats - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
      
      - name: Trigger GitHub Pages deployment
        run: |
          echo "Statistics updated successfully!"
          echo "Website updated at: https://jee2727.github.io/Test/web/players.html"
